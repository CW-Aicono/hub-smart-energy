server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml;
    gzip_disable "MSIE [1-6]\.";

    # index.html darf nie gecacht werden – nach jedem Deployment muss der
    # Browser die aktuelle Version mit den neuen Chunk-Hashes holen.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Versions-, Service-Worker- und Manifest-Dateien haben keinen Hash
    # im Namen und muessen immer frisch geladen werden.
    location ~* ^/(version\.json|sw\.js|registerSW\.js|workbox-[^/]*\.js|manifest[^/]*\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Vite-Dateien mit Content-Hash – unveraenderlich, dauerhaft cachebar.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uebrige statische Dateien (Icons, Bilder ohne Hash) – kurz cachen.
    location ~* \.(?:ico|gif|jpe?g|png|svg|webp|woff2?|eot|ttf)$ {
        expires 1d;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA-Routing: jede Unterseite liefert index.html – ebenfalls ohne Cache,
    # sonst haengen direkte Aufrufe wie /super-admin auf alten Versionen.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    error_page 404 /index.html;
}
